name: Feature request
description: Suggest something Motion Studio should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could work. A rough idea is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
  - type: markdown
    attributes:
      value: For open questions, Discussions is the better place.
