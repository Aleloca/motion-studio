name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The suite in three parts per system, side by side (the macOS suite alone took about 30 minutes; the repo is public,
        # so the extra runners cost nothing). Typecheck, i18n and build run once per system, in part 1.
        shard: [1, 2, 3]
    name: test (${{ matrix.os }}, ${{ matrix.shard }}/3)
    runs-on: ${{ matrix.os }}
    # A part takes about 10 minutes on macOS; a hang must not hold a runner for GitHub's 6 hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install ffmpeg
        run: ${{ matrix.os == 'macos-latest' && 'brew install ffmpeg' || 'sudo apt-get update && sudo apt-get install -y ffmpeg' }}
      # The renderer's integration tests need a real Chrome (never downloaded by the tests). GitHub's runner images ship
      # Google Chrome; install it when an image does not. Chromium's own sandbox stays on: never --no-sandbox.
      # Linux: Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor
      # (kernel.apparmor_restrict_unprivileged_userns=1), and Chromium's namespace sandbox needs them. Lift the restriction on
      # this throwaway VM (older kernels use kernel.unprivileged_userns_clone), then prove a sandboxed headless launch works
      # (scripts/ci-chrome-probe.sh: CI-safe flags and a hard deadline; on macOS a bare --dump-dom never exited).
      - name: Ensure Chrome (sandboxed)
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
            [ -x "$CHROME" ] || brew install --cask google-chrome
          else
            if ! command -v google-chrome >/dev/null; then
              wget -q -O "$RUNNER_TEMP/chrome.deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              sudo apt-get install -y "$RUNNER_TEMP/chrome.deb"
            fi
            CHROME="$(command -v google-chrome)"
            if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
            if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then sudo sysctl -w kernel.unprivileged_userns_clone=1; fi
          fi
          "$CHROME" --version
          bash scripts/ci-chrome-probe.sh "$CHROME" 120
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
        if: matrix.shard == 1
      - run: pnpm check:i18n
        if: matrix.shard == 1
      # The real-Electron render tests (about 7 minutes, macOS only) run in their own job below.
      - run: pnpm test --shard=${{ matrix.shard }}/3 --exclude '**/render-window.electron.test.ts'
        env:
          # The Chrome and ffmpeg integration tests (composition runtime, server and renderer) fail instead of skipping.
          MS_REQUIRE_CHROME: '1'
      - run: pnpm build
        if: matrix.shard == 1

  # The desktop's real-Electron render tests, one file that takes about 7 minutes on macOS (skipped on Linux): on their own
  # runner, side by side with the three parts above, instead of lengthening one of them.
  electron:
    name: test (macos-latest, electron)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install ffmpeg
        run: brew install ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run apps/desktop/test/render-window.electron.test.ts
        env:
          # A missing Electron binary or ffmpeg fails the job instead of skipping the file.
          MS_REQUIRE_ELECTRON: '1'
