name: Pages

# Builds site/ (the project's GitHub Pages site) and deploys it. GitHub Pages must be enabled in the repository settings
# with "GitHub Actions" as the source; this workflow never changes settings.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'packages/composition-runtime/**'
      - 'packages/shared/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Only the composition runtime and what it needs (shared): the site embeds the product's own runtime and validator.
      - run: pnpm install --frozen-lockfile --filter "@motion-studio/composition-runtime..."
      - run: pnpm --filter @motion-studio/composition-runtime build
      - run: node site/build.mjs
      - run: node --test 'site/test/*.test.mjs'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
