name: Release

# Runs only on tags created by the maintainer (v*), never on PRs or main.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # electron-builder creates the draft GitHub release
    env:
      MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
    steps:
      # The checkout is needed to read the versions; nothing else runs before the check.
      - uses: actions/checkout@v4
      - name: Check that the tag matches the package versions
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in apps/desktop/package.json apps/cli/package.json; do
            v="$(node -p "require('./$f').version")"
            if [ "$v" != "$tag" ]; then
              echo "::error::$f has version $v but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The desktop app ships the web UI and the composition runtime (prepare-resources copies both dist folders).
      - name: Build web UI and composition runtime
        run: pnpm --filter @motion-studio/composition-runtime build && pnpm --filter @motion-studio/web build
      - name: Decide macOS code signing
        shell: bash
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
      - name: Decide macOS notarization
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Notarization needs a signed app: only with the certificate and all three Apple secrets.
          if [ -n "$MAC_CERT_P12_BASE64" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "MAC_NOTARIZE=true" >> "$GITHUB_ENV"
          else
            echo "MAC_NOTARIZE=false" >> "$GITHUB_ENV"
          fi
      # electron-builder 26.15.3 unlocks its own temporary keychain with the certificate's password instead of the
      # keychain's (set-key-partition-list fails): the certificate is imported here into a keychain this job owns,
      # and electron-builder finds the Developer ID identity in the user's keychain list (no CSC_LINK).
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS' && env.MAC_CERT_P12_BASE64 != ''
        shell: bash
        env:
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kp="$(openssl rand -base64 24)"
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$kc" | grep -c "Developer ID Application" >/dev/null
      # Video analysis (spec §7): whisper.cpp's whisper-cli (pinned tag, Metal embedded, static) and the Silero VAD model for
      # both Mac architectures, shipped in the app's extraResources. macOS only: Windows and Linux use an installed Whisper.
      # Built and verified on every release (tag, architecture, system libraries only, the model's sha256): no cache, which
      # could not hit across tags and would skip the checks.
      - name: Build whisper-cli (arm64, x64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          command -v cmake >/dev/null || brew install cmake
          bash scripts/build-whisper.sh arm64 apps/desktop/vendor/whisper
          bash scripts/build-whisper.sh x64 apps/desktop/vendor/whisper
      - name: Package and publish draft release
        shell: bash
        run: pnpm --filter motion-studio-desktop dist --publish always "-c.mac.notarize=$MAC_NOTARIZE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}

  # Independent of the desktop builds: a failed installer on one OS does not block the npm package.
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the package versions
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in apps/desktop/package.json apps/cli/package.json; do
            v="$(node -p "require('./$f').version")"
            if [ "$v" != "$tag" ]; then
              echo "::error::$f has version $v but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - name: Skip notice
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN not set, skipping npm publish"
      - uses: pnpm/action-setup@v4
        if: env.NPM_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.NPM_TOKEN != ''
      - run: pnpm build
        if: env.NPM_TOKEN != ''
      - run: pnpm --filter @motion-studio/cli publish --access public --no-git-checks
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
