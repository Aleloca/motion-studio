name: Release

# Runs only on tags created by the maintainer (v*), never on PRs or main.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # electron-builder creates the draft GitHub release
    env:
      MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web UI
        run: pnpm --filter @motion-studio/web build
      - name: Decide macOS code signing
        shell: bash
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
      - name: Package and publish draft release
        run: pnpm --filter motion-studio-desktop dist --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}

  npm:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip notice
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN not set, skipping npm publish"
      - uses: actions/checkout@v4
        if: env.NPM_TOKEN != ''
      - uses: pnpm/action-setup@v4
        if: env.NPM_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.NPM_TOKEN != ''
      - run: pnpm build
        if: env.NPM_TOKEN != ''
      - run: pnpm --filter motion-studio-app publish --access public --no-git-checks
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
