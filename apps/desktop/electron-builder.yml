appId: io.github.aleloca.motionstudio
productName: Motion Studio
directories: { output: release, buildResources: build }
files: [dist/**, package.json]
extraResources:
  - { from: resources/web, to: web }
  - { from: resources/mcp-studio.mjs, to: mcp-studio.mjs }
  # The composition runtime (index.html, runtime.js, preview.js, layer.js, clock.js): served by the composition server to the render
  # windows and the live preview (RUNTIME_DIST_DIR in development).
  - { from: resources/runtime, to: runtime }
  # The licences of the third-party software the app ships (whisper.cpp and the Silero VAD model on macOS).
  - { from: THIRD_PARTY_NOTICES.md, to: THIRD_PARTY_NOTICES.md }
asarUnpack: ["**/node_modules/@napi-rs/keyring*/**"]
mac:
  icon: build/icon.icns
  category: public.app-category.video
  target: [{ target: dmg, arch: [arm64, x64] }, { target: zip, arch: [arm64, x64] }]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Video analysis (spec §7): whisper.cpp's whisper-cli and the Silero VAD model of this architecture, built by
  # scripts/build-whisper.sh into vendor/whisper/<arch> and copied by scripts/prepare-resources.mjs; signed and notarized
  # with the app. Not built (a local package): the folder is missing, electron-builder skips it, the app uses an installed Whisper.
  extraResources:
    - { from: 'resources/whisper/${arch}', to: whisper }
win: { icon: build/icon.ico, target: [nsis] }
linux: { icon: build/icon.png, target: [AppImage], category: Video }
publish: { provider: github, owner: Aleloca, repo: motion-studio, releaseType: draft }
